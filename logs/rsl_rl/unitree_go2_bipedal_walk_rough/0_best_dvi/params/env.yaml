  - 7.5
  - 7.5
  - 7.5
  lookat: !!python/tuple
  - 0.0
  - 0.0
  - 0.0
  cam_prim_path: /OmniverseKit_Persp
  resolution: !!python/tuple
  - 1280
  - 720
  origin_type: world
  env_index: 0
  asset_name: null
  body_name: null
sim:
  device: cuda:0
  dt: 0.005
  gravity: !!python/tuple
  - 0.0
  - 0.0
  - -9.81
  physics_prim_path: /physicsScene
  physics_material:
    func: isaaclab.sim.spawners.materials.physics_materials:spawn_rigid_body_material
    static_friction: 1.2
    dynamic_friction: 1.0
    restitution: 0.0
    compliant_contact_stiffness: null
    compliant_contact_damping: null
    friction_combine_mode: multiply
    restitution_combine_mode: multiply
    _usd_applied_schema: PhysxMaterialAPI
    _usd_field_exceptions: {}
    _usd_namespace: physxMaterial
  use_fabric: true
  render_interval: 4
  enable_scene_query_support: false
  physics:
    class_type: isaaclab_newton.physics.dvi_manager:NewtonDVIManager
    num_substeps: 2
    debug_mode: false
    use_cuda_graph: true
    collapse_fixed_joints: true
    disable_robot_self_collisions: false
    jointed_self_collision_filter_hops: 0
    self_collision_shape_contraction: 0.0
    solver_cfg:
      class_type: isaaclab_newton.physics.dvi_manager:NewtonDVIManager
      solver_type: dvi
      joint_limit_solver_type: sparse_jacobi
      joint_limit_max_iterations: 10
      joint_limit_omega: 0.3
      joint_limit_relax: 0.9
      joint_limit_reg: 1.0e-08
      joint_limit_alpha: 0.0
      joint_limit_recovery_speed: 10.0
      joint_solver_type: sparse_ldl
      joint_omega: 0.3
      joint_relax: 0.8
      joint_reg: 1.0e-06
      joint_alpha: 0.0
      joint_recovery_speed: 100000.0
      use_meca: true
      use_rcm: false
      contact_solver_type: sparse_jacobi
      contact_max_iterations: 20
      coupling_iterations: 1
      cache_factorization: true
      post_stabilize_joints: false
      contact_omega: 0.1
      contact_relax: 0.9
      contact_reg: 0.001
      contact_alpha: 0.0
      contact_compliance: 1.0e-05
      contact_recovery_speed: 5.0
      contact_tolerance: null
      contact_aspg_seed_alpha_max: false
      contact_aspg_no_momentum: false
      deterministic: true
      contact_aspg_alpha_max_rel: 2.0
      angular_damping: 0.0
      actuator_integration: explicit
      enable_actuation: true
      diagonal_precondition: true
      precond_reg: 0.0001
      joint_iterative_refinement_steps: 1
      armature_override: null
      contact_block_precondition: false
      contact_friction_projection: tangential
    collision_cfg:
      broad_phase: explicit
      reduce_contacts: true
      rigid_contact_max: 665536
      max_triangle_pairs: 2500000
      soft_contact_max: null
      soft_contact_margin: 0.01
      requires_grad: null
      sdf_hydroelastic_config: null
    default_shape_cfg:
      margin: 0.0
      gap: 0.005
  render:
    enable_translucency: null
    enable_reflections: null
    enable_global_illumination: null
    antialiasing_mode: null
    enable_dlssg: null
    enable_dl_denoiser: null
    dlss_mode: null
    enable_direct_lighting: null
    samples_per_pixel: null
    enable_shadows: null
    enable_ambient_occlusion: null
    dome_light_upper_lower_strategy: null
    carb_settings: null
