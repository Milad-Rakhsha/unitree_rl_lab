        - .*
        effort_limit: null
        velocity_limit: null
        effort_limit_sim: null
        velocity_limit_sim: null
        stiffness: 25.0
        damping: 0.5
        armature: null
        friction: 0.01
        dynamic_friction: null
        viscous_friction: null
        min_delay: 0
        max_delay: 0
        X1: 13.5
        X2: 30
        Y1: 20.2
        Y2: 23.4
        Fs: 0.2
        Fd: 0.1
        Va: 0.01
    actuator_value_resolution_debug_print: false
    joint_sdk_names:
    - FR_hip_joint
    - FR_thigh_joint
    - FR_calf_joint
    - FL_hip_joint
    - FL_thigh_joint
    - FL_calf_joint
    - RR_hip_joint
    - RR_thigh_joint
    - RR_calf_joint
    - RL_hip_joint
    - RL_thigh_joint
    - RL_calf_joint
