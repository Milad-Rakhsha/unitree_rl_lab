      variants: null
    init_state:
      pos: !!python/tuple
      - 0.0
      - 0.0
      - 0.4
      rot: !!python/tuple
      - 0.0
      - 0.0
      - 0.0
      - 1.0
      lin_vel: !!python/tuple
      - 0.0
      - 0.0
      - 0.0
      ang_vel: !!python/tuple
      - 0.0
      - 0.0
      - 0.0
